name: Build APK

on:
  push:
    branches: [main, "claude/**", "ccr-**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -80 || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meteorite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
